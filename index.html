    <script>
      // 主题预应用：React 挂载前先上 dark 类，避免深色用户启动瞬间闪白屏
      try {
        var d = JSON.parse(localStorage.getItem('xiaochengjiu/data/v1') || 'null')
        var t = d && d.settings && d.settings.theme
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        // 状态栏颜色与首帧背景同步预应用，消除启动闪变（Opus 报告 P1-6）
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', dark ? '#0B1120' : '#FFF3E4')
        document.documentElement.style.backgroundColor = dark ? '#0B1120' : '#FFF3E4'
      } catch (e) {}
    </script>
