<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="theme-color" content="#FFF3E4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>小成就 - 每日微习惯与情绪成长手账</title>
    <meta name="description" content="温和无压力的微习惯打卡、番茄专注、心情记录与个人成长手账应用，用看得见的正反馈陪伴每一天。" />
    <meta property="og:title" content="小成就 - 每日微习惯与情绪成长手账" />
    <meta property="og:description" content="温和无压力的微习惯打卡、番茄专注、心情记录与个人成长手账应用，用看得见的正反馈陪伴每一天。" />
    <script>
      // 主题预应用：React 挂载前先同步 dark 类、theme-color 与首帧底色，消除启动瞬间闪白/闪橙
      try {
        var d = JSON.parse(localStorage.getItem('xiaochengjiu/data/v1') || 'null')
        var t = d && d.settings && d.settings.theme
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var bg = dark ? '#0B1120' : '#FFF3E4'
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.backgroundColor = bg
        var metaTheme = document.querySelector('meta[name="theme-color"]')
        if (metaTheme) metaTheme.setAttribute('content', bg)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
